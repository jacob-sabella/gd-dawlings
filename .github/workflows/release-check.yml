name: Release Check

# Full pre-release validation: the headless suite, then the native core and a full export for
# Linux and Windows, with the two builds kept as artifacts.
#
# Runs on:
#   - pull_request to master -- keeps every change honest.
#   - workflow_call          -- reused as the gate by release-stable.yml; a
#                               red run blocks the release, and the artifacts are what they ship.
#   - workflow_dispatch      -- run manually from the Actions tab.

on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    # Skip fork PRs (nothing of this repo's is available to them); internal pushes, reused calls
    # and manual runs always proceed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml

  export:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Which dawkit
        id: dawkit
        run: echo "sha=$(git ls-tree HEAD vendor/dawkit | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Compilers
        run: |
          sudo apt-get update -q
          # The keys helper (native/keys.c) is PipeWire and ALSA.
          sudo apt-get install -y -q cmake g++ mingw-w64 pkg-config libpipewire-0.3-dev libasound2-dev libx11-dev
          # The posix thread model, which the local builds (Arch's MinGW) are made with.
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache Godot and its export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x ~/godot-bin/godot ]; then
            curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mkdir -p ~/godot-bin
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
            rm -f godot.zip
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$dest" ]; then
            curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mkdir -p "$dest"
            mv templates/* "$dest/"
            rm -rf templates.tpz templates
          fi

      # Every target an export needs, each cached on its own: the linux debug build (shared with
      # ci.yml's own cache key) plus the two release builds only an export needs.
      - name: Cache dawkit's native core (linux, debug)
        uses: actions/cache@v6
        with:
          path: |
            vendor/dawkit/native/build
            vendor/dawkit/native/extension_api.json
          key: dawkit-native-linux-debug-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-linux-debug-

      - name: Cache dawkit's native core (linux, release)
        uses: actions/cache@v6
        with:
          path: vendor/dawkit/native/build-linux-template_release
          key: dawkit-native-linux-release-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-linux-release-

      - name: Cache dawkit's native core (windows, release)
        uses: actions/cache@v6
        with:
          path: vendor/dawkit/native/build-windows-template_release
          key: dawkit-native-windows-release-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-windows-release-

      - name: dawkit's native core
        run: |
          vendor/dawkit/tools/build_native.sh linux all
          vendor/dawkit/tools/build_native.sh windows release

      - name: Stamp the version
        run: scripts/set-version.sh --godot "$(scripts/set-version.sh --get)-${GITHUB_RUN_NUMBER}"

      - name: Import
        run: godot --headless --path . --import || true

      - name: Export
        run: |
          mkdir -p build/linux build/windows
          godot --headless --path . --export-release "Linux" build/linux/dawlings.x86_64
          godot --headless --path . --export-release "Windows" build/windows/dawlings.exe
          # dawkit's plugin scanner runs as a program of its own, so it sits beside the game, not in
          # its pack (PluginCatalogue.scanner).
          cp addons/dawkit/bin/dawkit_scan.linux.x86_64 build/linux/
          cp addons/dawkit/bin/dawkit_scan.windows.x86_64.exe build/windows/
          cp docs/playtest.md build/linux/README.md
          cp docs/playtest.md build/windows/README.md
          test -s build/linux/dawlings.x86_64 && test -s build/windows/dawlings.exe
          ls build/linux/libdawkit.* build/windows/libdawkit.*

      - uses: actions/upload-artifact@v7
        with:
          name: dawlings-linux
          path: build/linux

      - uses: actions/upload-artifact@v7
        with:
          name: dawlings-windows
          path: build/windows
