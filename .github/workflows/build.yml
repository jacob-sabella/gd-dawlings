# Tests on every push, fast: the native core is cached (keyed on dawkit's own commit, so an
# unchanged dawkit is a cache hit and the compile step is the "a second" its own script promises,
# not a from-scratch build). The heavier job -- dawkit's native core for Linux AND Windows, the
# full export of both, artifacts -- only runs where that is actually worth paying for: a pull
# request, a manual run, or a tag (which also cuts a release with the two zips). A plain push to
# master used to run the full heavy job every time; 41 of those in two days was most of a
# month's Actions minutes on their own.
#
# dawkit is a private repository of its own. It is checked out with a read-only deploy key on
# it, whose private half is this repository's DAWKIT_DEPLOY_KEY secret.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A push while a run from the last one is still going is almost always a superseded commit (this
# project iterates in short loops); finish the new one, not the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Which dawkit
        id: dawkit
        run: echo "sha=$(git ls-tree HEAD vendor/dawkit | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jacob-sabella/gd-dawkit
          ref: ${{ steps.dawkit.outputs.sha }}
          path: vendor/dawkit
          ssh-key: ${{ secrets.DAWKIT_DEPLOY_KEY }}
          submodules: true

      - name: Compilers
        run: |
          sudo apt-get update -q
          # The keys helper (native/keys.c), which the suite builds and plays, is PipeWire and ALSA.
          # Linux only here: the suite runs on this machine, never Windows.
          sudo apt-get install -y -q cmake g++ pkg-config libpipewire-0.3-dev libasound2-dev

      - name: Cache Godot and its export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot
        run: |
          if [ ! -x ~/godot-bin/godot ]; then
            base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
            curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mkdir -p ~/godot-bin
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
            rm -f godot.zip
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot

      # Keyed on dawkit's own commit, which `build_native.sh` is already incremental against
      # (its own comment: "a build with nothing changed takes a second") -- the GDExtension's
      # object files just never existed on a fresh runner before. Debug only: the editor and the
      # suite load template_debug, never template_release.
      - name: Cache dawkit's native core (linux, debug)
        uses: actions/cache@v4
        with:
          path: |
            vendor/dawkit/native/build
            vendor/dawkit/native/extension_api.json
          key: dawkit-native-linux-debug-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-linux-debug-

      - name: dawkit's native core
        run: vendor/dawkit/tools/build_native.sh linux debug

      - name: Import
        run: godot --headless --path . --import || true

      - name: Tests
        run: |
          timeout 600 godot --headless --path . tests/tests.tscn 2>&1 | tee tests.log | grep -E "checks,|  FAIL" || true
          grep -q "checks, 0 failed" tests.log

  build:
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Which dawkit
        id: dawkit
        run: echo "sha=$(git ls-tree HEAD vendor/dawkit | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jacob-sabella/gd-dawkit
          ref: ${{ steps.dawkit.outputs.sha }}
          path: vendor/dawkit
          ssh-key: ${{ secrets.DAWKIT_DEPLOY_KEY }}
          submodules: true

      - name: Compilers
        run: |
          sudo apt-get update -q
          # The keys helper (native/keys.c), which the suite builds and plays, is PipeWire and ALSA.
          sudo apt-get install -y -q cmake g++ mingw-w64 pkg-config libpipewire-0.3-dev libasound2-dev
          # The posix thread model, which the local builds (Arch's MinGW) are made with.
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache Godot and its export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x ~/godot-bin/godot ]; then
            curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mkdir -p ~/godot-bin
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
            rm -f godot.zip
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$dest" ]; then
            curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mkdir -p "$dest"
            mv templates/* "$dest/"
            rm -rf templates.tpz templates
          fi

      # Every target this job needs, each cached on its own: the linux debug build (shared with
      # the test job's own cache key, so this job often finds that one already warm) plus the two
      # release builds only an export needs.
      - name: Cache dawkit's native core (linux, debug)
        uses: actions/cache@v4
        with:
          path: |
            vendor/dawkit/native/build
            vendor/dawkit/native/extension_api.json
          key: dawkit-native-linux-debug-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-linux-debug-

      - name: Cache dawkit's native core (linux, release)
        uses: actions/cache@v4
        with:
          path: vendor/dawkit/native/build-linux-template_release
          key: dawkit-native-linux-release-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-linux-release-

      - name: Cache dawkit's native core (windows, release)
        uses: actions/cache@v4
        with:
          path: vendor/dawkit/native/build-windows-template_release
          key: dawkit-native-windows-release-${{ steps.dawkit.outputs.sha }}
          restore-keys: dawkit-native-windows-release-

      - name: dawkit's native core
        run: |
          vendor/dawkit/tools/build_native.sh linux all
          vendor/dawkit/tools/build_native.sh windows release

      - name: Import
        run: godot --headless --path . --import || true

      - name: Export
        run: |
          mkdir -p build/linux build/windows
          godot --headless --path . --export-release "Linux" build/linux/dawlings.x86_64
          godot --headless --path . --export-release "Windows" build/windows/dawlings.exe
          cp docs/playtest.md build/linux/README.md
          cp docs/playtest.md build/windows/README.md
          test -s build/linux/dawlings.x86_64 && test -s build/windows/dawlings.exe
          ls build/linux/libdawkit.* build/windows/libdawkit.*

      - uses: actions/upload-artifact@v4
        with:
          name: dawlings-linux
          path: build/linux

      - uses: actions/upload-artifact@v4
        with:
          name: dawlings-windows
          path: build/windows

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          mv linux dawlings && zip -qr "dawlings-${GITHUB_REF_NAME}-linux.zip" dawlings && mv dawlings linux
          mv windows dawlings && zip -qr "dawlings-${GITHUB_REF_NAME}-windows.zip" dawlings && mv dawlings windows
          gh release create "$GITHUB_REF_NAME" --title "dawlings $GITHUB_REF_NAME" --notes-file ../docs/playtest.md \
              "dawlings-${GITHUB_REF_NAME}-linux.zip" "dawlings-${GITHUB_REF_NAME}-windows.zip"
